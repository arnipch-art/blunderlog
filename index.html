<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blunderlog</title>
<meta name="description" content="Enter your chess.com username and get a Stockfish review of your games: accuracy, openings, estimated rating and the mistakes you keep repeating – all in your browser.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titlerow">
      <div>
        <div class="brand">Blunderlog</div>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="sv">SV</button><button type="button" data-lang="en">EN</button></div>
    </div>
    <form id="form" class="controls">
      <label class="field grow"><span data-i18n="user"></span><input id="user" type="text" autocomplete="off" spellcheck="false" placeholder="hikaru" required></label>
      <label class="field"><span data-i18n="games"></span>
        <select id="count"><option value="10" data-i18n-n="10"></option><option value="20" selected data-i18n-n="20"></option><option value="50" data-i18n-n="50"></option><option value="0" data-i18n="all"></option></select></label>
      <label class="field"><span data-i18n="accuracyLevel"></span>
        <select id="profile"><option value="fast" data-i18n="fast"></option><option value="normal" selected data-i18n="normal"></option><option value="deep" data-i18n="deep"></option></select></label>
      <fieldset class="field classes"><legend data-i18n="timeClass"></legend>
        <label><input type="checkbox" name="cls" value="rapid" checked> rapid</label>
        <label><input type="checkbox" name="cls" value="blitz" checked> blitz</label>
        <label><input type="checkbox" name="cls" value="bullet"> bullet</label>
        <label><input type="checkbox" name="cls" value="daily" checked> daily</label>
      </fieldset>
      <div class="actions">
        <button id="run" type="submit" class="primary" data-i18n="analyse"></button>
        <button id="stop" type="button" hidden data-i18n="stop"></button>
        <button id="clear" type="button" class="quiet" hidden data-i18n="clear"></button>
      </div>
      <label class="auto"><input id="auto" type="checkbox" checked> <span data-i18n="autoCheck"></span></label>
    </form>
    <div id="progress" hidden aria-live="polite"><div class="ptext"><span id="progress-game"></span> <span id="progress-text"></span></div><div class="ptrack"><div id="progress-bar"></div></div></div>
    <div id="error" class="error" hidden></div>
  </header>

  <p id="empty" class="empty" data-i18n="empty"></p>

  <section id="game" class="game" hidden></section>
  <main id="dashboard"></main>

  <footer class="foot" id="footer"></footer>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
